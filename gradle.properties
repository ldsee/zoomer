# Enable AndroidX (required - the app uses androidx.* libraries)
android.useAndroidX=true

# Suppress the compileSdk=35 warning (it works fine, just newer than AGP's tested level)
android.suppressUnsupportedCompileSdk=35

# Standard JVM heap for the Gradle build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official
